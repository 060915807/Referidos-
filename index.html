<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NUKO Capital — Programa de Referidos</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" rel="stylesheet">
<style>
/* [MANTÉN TODOS TUS ESTILOS AQUÍ - SON LOS MISMOS QUE YA TENÍAS] */
:root { --dark: #0A0E1A; --navy: #0D1B3E; --gold: #C9992A; --gold2: #F0B93A; --white: #FFFFFF; --gray3: #B0A898; --green: #1B7A4B; --border: rgba(201,153,42,0.15); }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: var(--dark); color: var(--white); min-height: 100vh; }
/* ... Y EL RESTO DE TUS ESTILOS ... */
</style>
</head>
<body>
<!-- MANTÉN LA ESTRUCTURA HTML QUE YA TENÍAS -->
<script>
// ============================================================
// CONFIGURACIÓN - REEMPLAZA CON TU ID
// ============================================================
const SHEET_ID = '1Hb6hhrx_fJv8nM9ROUbiEOvHrT0MhzJo9qfNigL4cME';
const SHEET_GID = '0'; // 0 = primera hoja, cambia si tu tabla está en otra pestaña

// ============================================================
// CARGAR DATOS DESDE GOOGLE SHEETS (MÉTODO CSV - SIN API KEY)
// ============================================================
async function cargarDatos() {
  try {
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${SHEET_GID}`;
    
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error('Error al cargar los datos: ' + response.status);
    }
    
    const csvText = await response.text();
    const rows = csvText.split('\n').filter(row => row.trim() !== '');
    
    if (rows.length < 2) {
      throw new Error('No se encontraron datos en la hoja');
    }
    
    // Convertir CSV a objetos
    const headers = rows[0].split(',').map(h => h.trim().replace(/"/g, '').toLowerCase().replace(/ /g, '_'));
    const dataRows = rows.slice(1);
    
    const objetos = dataRows.map(row => {
      const values = row.split(',').map(v => v.trim().replace(/"/g, ''));
      const obj = {};
      headers.forEach((header, index) => {
        obj[header] = values[index] || '';
      });
      return obj;
    });
    
    return objetos;
    
  } catch (error) {
    console.error('Error:', error);
    document.getElementById('loading').innerHTML = `
      ❌ Error al cargar datos: ${error.message}<br>
      <small>Verifica que la hoja esté publicada y el ID sea correcto.</small>
      <br><br>
      <button onclick="location.reload()" style="padding:8px 20px;background:var(--gold);color:var(--dark);border:none;border-radius:6px;cursor:pointer;font-weight:600;">Reintentar</button>
    `;
    return null;
  }
}

// ============================================================
// FUNCIONES DE RENDERIZADO (AJÚSTALAS SEGÚN TUS COLUMNAS)
// ============================================================
function renderizarDashboard(data) {
  if (!data || data.length === 0) {
    document.getElementById('loading').innerHTML = '❌ No se encontraron datos. Verifica que la hoja tenga información.';
    return;
  }

  document.getElementById('loading').style.display = 'none';
  document.getElementById('dashboardContent').style.display = 'block';
  document.getElementById('fechaActual').textContent = new Date().toLocaleDateString('es-ES', { day:'numeric', month:'long', year:'numeric' });

  // Calcular KPIs - AJUSTA LOS NOMBRES DE COLUMNAS SEGÚN TU TABLA
  const referentes = new Set(data.map(r => r.cliente_referente || r.referente || r.referente_cliente || '')).size;
  const referidosTotales = data.length;
  const referidosActivos = data.filter(r => (r.estado || r.estatus || '').toLowerCase().includes('activo')).length;
  
  let volumenTotal = 0;
  data.forEach(r => {
    const v = parseFloat(r.volumen_factorizado) || parseFloat(r.volumen_facturado) || parseFloat(r.monto_total) || 0;
    volumenTotal += v;
  });
  
  let permanenciaTotal = 0, permanenciaCount = 0;
  data.forEach(r => {
    const p = parseInt(r.permanencia_dias) || parseInt(r.dias_activo) || parseInt(r.dias_permanencia) || 0;
    if (p > 0) { permanenciaTotal += p; permanenciaCount++; }
  });
  const promedioPermanencia = permanenciaCount > 0 ? Math.round(permanenciaTotal / permanenciaCount) : 0;

  // Renderizar KPIs
  const kpiGrid = document.getElementById('kpiGrid');
  if (kpiGrid) {
    const kpis = [
      { label: 'Referentes únicos', value: referentes, class: 'blue', sub: 'clientes que refirieron' },
      { label: 'Total referidos', value: referidosTotales, class: '', sub: 'registrados en el programa' },
      { label: 'Referidos activos', value: referidosActivos, class: 'green', sub: referidosTotales > 0 ? Math.round((referidosActivos/referidosTotales)*100) + '% del total' : '0%' },
      { label: 'Volumen factorizado', value: volumenTotal >= 1000 ? '$' + (volumenTotal/1000).toFixed(1) + 'K' : '$' + volumenTotal.toFixed(0), class: 'amber', sub: 'total facturado por referidos' },
      { label: 'Permanencia promedio', value: promedioPermanencia + ' días', class: '', sub: 'tiempo activo promedio' }
    ];
    
    kpiGrid.innerHTML = kpis.map(k => `
      <div class="kpi-card">
        <div class="kpi-label">${k.label}</div>
        <div class="kpi-value ${k.class}">${k.value}</div>
        <div class="kpi-sub">${k.sub}</div>
      </div>
    `).join('');
  }

  // Renderizar tabla de referidos - AJUSTA LOS NOMBRES DE COLUMNAS
  const tbody = document.getElementById('tbReferidos');
  if (tbody) {
    tbody.innerHTML = data.slice(0, 50).map((row, i) => {
      const estado = (row.estado || row.estatus || 'Pendiente').toLowerCase();
      let badgeClass = 'badge-gray';
      if (estado.includes('activo')) badgeClass = 'badge-green';
      else if (estado.includes('proceso') || estado.includes('revisión')) badgeClass = 'badge-amber';
      else if (estado.includes('inactivo') || estado.includes('suspendido')) badgeClass = 'badge-red';
      
      const ref = row.cliente_referente || row.referente || row.referente_cliente || '-';
      const modal = row.modalidad || row.metodo || 'ACH/Wire';
      const vol = parseFloat(row.volumen_factorizado) || parseFloat(row.volumen_facturado) || parseFloat(row.monto_total) || 0;
      const dias = parseInt(row.permanencia_dias) || parseInt(row.dias_activo) || parseInt(row.dias_permanencia) || 0;
      const nombre = row.cliente_referido || row.referido || row.nombre_referido || `Ref-${i+1}`;
      
      return `<tr>
        <td style="color:var(--gray3);font-size:11px;">${i+1}</td>
        <td>${nombre}</td>
        <td style="color:var(--gray3);font-size:12px;">${ref}</td>
        <td><span class="badge badge-blue">${modal}</span></td>
        <td class="num" style="color:var(--gold2);">$${vol.toFixed(0)}</td>
        <td class="num">${dias > 0 ? dias + ' días' : '—'}</td>
        <td><span class="badge ${badgeClass}">${estado}</span></td>
      </tr>`;
    }).join('');
    
    if (data.length > 50) {
      tbody.innerHTML += `<tr><td colspan="7" style="text-align:center;color:var(--gray3);font-size:12px;padding:10px;">... y ${data.length - 50} referidos más</td></tr>`;
    }
  }
}

// ============================================================
// INICIALIZACIÓN
// ============================================================
document.addEventListener('DOMContentLoaded', async () => {
  const data = await cargarDatos();
  if (data) {
    renderizarDashboard(data);
  }
});
</script>
</body>
</html>
